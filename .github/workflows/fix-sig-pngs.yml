name: fix-sig-pngs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64-as-text PNGs and remove this workflow
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import base64, pathlib, sys
          for name in ('banner-2026-11-26.png', 'banner-2026-11-26@2x.png'):
              p = pathlib.Path('sig') / name
              data = p.read_bytes()
              if data.startswith(b'\x89PNG\r\n\x1a\n'):
                  print(f'{name}: already a PNG ({len(data)} bytes)')
                  continue
              raw = base64.b64decode(data, validate=True)
              if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                  sys.exit(f'{name}: decoded bytes are not a PNG')
              p.write_bytes(raw)
              print(f'{name}: wrote {len(raw)} bytes')
          PY
          rm -f .github/workflows/fix-sig-pngs.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "sig/banner-2026-11-26.png" "sig/banner-2026-11-26@2x.png" .github
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix: fichiers PNG binaires du banner dans sig/"
          git push
